name: MOTOPEDIA Historical Backfill

on:
  push:
    branches:
      - main
    paths:
      - "scripts/motopedia-backfill.mjs"
      - ".github/workflows/motopedia-backfill.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: motopedia-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out MotoCODEX
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run respectful historical crawler
        continue-on-error: true
        env:
          MOTOPEDIA_MAX_PAGES: "28"
          MOTOPEDIA_MAX_FACTS_PER_PAGE: "100"
          MOTOPEDIA_DELAY_MS: "900"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/motopedia-backfill.mjs

      - name: Commit updated library and checkpoint
        run: |
          git config user.name "MotoPEDIA Backfill"
          git config user.email "actions@users.noreply.github.com"
          git add data/motopedia/index.json data/motopedia/checkpoint.json
          if git diff --cached --quiet; then
            echo "No MOTOPEDIA data changes to commit."
            exit 0
          fi
          git commit -m "Update MOTOPEDIA historical library"
          git push
