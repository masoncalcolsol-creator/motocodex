name: Sports Preview Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/mlb/**'
      - 'app/npb/**'
      - 'app/nfl/**'
      - 'app/nhl/**'
      - 'app/nascar/**'
      - 'app/ufc/**'
      - 'app/sports/**'
      - 'app/api/sports/**'
      - 'components/SportsBeta*'
      - 'components/SportsPwa.tsx'
      - 'lib/sports-beta.ts'
      - 'public/sports-*'
      - '.github/workflows/sports-preview-diagnostics.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Exact production build
        id: exact_build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload raw build log
        uses: actions/upload-artifact@v4
        with:
          name: sports-build-log
          path: build.log
          retention-days: 1
      - name: Enforce build result
        shell: bash
        run: |
          if [ "${{ steps.exact_build.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi
