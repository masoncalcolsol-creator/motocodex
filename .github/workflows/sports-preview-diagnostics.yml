name: Sports Preview Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/mlb/**'
      - 'app/npb/**'
      - 'app/nfl/**'
      - 'app/nhl/**'
      - 'app/nascar/**'
      - 'app/ufc/**'
      - 'app/sports/**'
      - 'app/api/sports/**'
      - 'components/SportsBeta*'
      - 'components/SportsPwa.tsx'
      - 'lib/sports-beta.ts'
      - 'public/sports-*'
      - '.github/workflows/sports-preview-diagnostics.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Build and print only failure tail
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "===== BUILD FAILURE TAIL ====="
            tail -120 build.log
            exit $code
          fi
          tail -40 build.log
